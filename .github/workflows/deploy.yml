name: CI/CD Innovatech - Build & Push to Docker Hub


on:
  push:
    branches: [ "deploy" ]

jobs:



  build-back-ventas:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Construir y subir imagen de Ventas
      uses: docker/build-push-action@v4
      with:
        context: ./back-Ventas_SpringBoot
        file: ./back-Ventas_SpringBoot/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-back-ventas:latest



  build-back-despachos:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Construir y subir imagen de Despachos
      uses: docker/build-push-action@v4
      with:
        context: ./back-Despachos_SpringBoot
        file: ./back-Despachos_SpringBoot/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-back-despachos:latest



  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Construir y subir imagen del Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./front_despacho
        file: ./front_despacho/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest