events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # 1. Servir los archivos estaticos del Frontend React Vite
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 2. Proxy para el Backend de Ventas (la BD)
        location /api/v1/ventas {
            proxy_pass http://10.0.1.73:8080/api/v1/ventas;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Proxy para el Backend de Despachos
        location /api/v1/despachos {
            proxy_pass http://10.0.2.36:8081/api/v1/despachos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}