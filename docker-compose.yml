version: '3.8'

services:
  #DATOS
  db:
    image: mariadb:10.5
    container_name: innovatech-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: admin123
      MARIADB_DATABASE: innovatech_db
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - innovatech-net

  #VENTAS
  back-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    container_name: innovatech-back-ventas
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_ENDPOINT=db
      - DB_PORT=3306
      - DB_NAME=innovatech_db
      - DB_USERNAME=root
      - DB_PASSWORD=admin123
    depends_on:
      - db
    networks:
      - innovatech-net

  #DESPACHOS
  back-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    container_name: innovatech-back-despachos
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=db
      - DB_ENDPOINT=db
      - DB_PORT=3306
      - DB_NAME=innovatech_db
      - DB_USERNAME=root
      - DB_PASSWORD=admin123
    depends_on:
      - db
    networks:
      - innovatech-net

  #FRONTEND
  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    container_name: innovatech-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - back-ventas
      - back-despachos
    networks:
      - innovatech-net

volumes:
  dbdata:

networks:
  innovatech-net:
    driver: bridge
